<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Every Stacklands card with recipes, packs and drops: searchable and screen reader friendly.">
<title>Stacklands cards</title>
<style>
:root {
  --bg: #f6f1e7; --panel: #fffaf0; --ink: #2b2118; --muted: #6b5d4f; --line: #d9ccb7;
  --accent: #9a4f12; --accent-ink: #ffffff; --focus: #1f5fbf; --chip: #efe4d1;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1d1915; --panel: #27211c; --ink: #f2e9dc; --muted: #b8a994; --line: #4a3f34;
          --accent: #f0a35e; --accent-ink: #1d1915; --focus: #8ab4ff; --chip: #3a3029; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
header, main { max-width: 1200px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; }
h1 { margin: 0 0 4px; font-size: 1.6rem; }
.sub { color: var(--muted); margin: 0; }
.controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; align-items: end; margin: 12px 0; }
.controls .wide { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
label.check { display: flex; align-items: center; gap: 8px; }
input[type=search], select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); width: 100%; }
button.plain { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); cursor: pointer; }
#hint { color: var(--muted); font-size: .9rem; margin: 0; }
#count { font-weight: 600; margin: 8px 0; }
.grid { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { --bg: var(--panel); --bd: var(--line); --ic: var(--ink); --tx: var(--ink);
        width: 100%; height: 100%; min-height: 200px; display: flex; flex-direction: column; align-items: stretch; gap: 6px;
        text-align: center; font: inherit; color: var(--tx); background: var(--bg); border: 5px solid var(--bd);
        border-radius: 12px; padding: 0 0 8px; overflow: hidden; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,.25); transition: transform .08s; }
.card:hover { transform: translateY(-2px); }
.card .n { font-weight: 700; line-height: 1.2; min-height: 2.6em; display: flex; align-items: center; justify-content: center;
           padding: 4px 6px; background: var(--bd); color: var(--tx2, var(--tx)); }
.pic { display: block; flex: 1; min-height: 90px; width: 100%; height: 90px; object-fit: contain; }
.pic.none { visibility: hidden; }
.picw { position: relative; flex: 1; display: flex; }
.age { position: absolute; top: 4px; right: 6px; min-width: 1.9em; height: 1.9em; padding: 0 5px; border-radius: 999px;
       display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .85rem;
       background: #4B362D; color: #F2E6C9; border: 2px solid #F2E6C9; box-shadow: 0 1px 2px rgba(0,0,0,.35); }
.age.none { display: none; }
.card .m { font-size: .85rem; opacity: .85; }
.card.unknown { filter: grayscale(.7); opacity: .8; }
.card.unknown .n { font-style: italic; }
.hero { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 4px 0 8px; }
.hero .card { width: 150px; min-height: 210px; flex: none; cursor: default; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#tip { position: fixed; z-index: 10; max-width: 360px; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 8px;
       font-size: .9rem; pointer-events: none; display: none; }
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(760px, calc(100% - 32px)); max-height: calc(100% - 32px);
         background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg { padding: 16px 20px 20px; }
.dlg h2 { margin: 0 0 4px; }
.dlg h3 { margin: 18px 0 6px; font-size: 1.05rem; }
.dlg ul { margin: 0; padding-left: 20px; }
.dlg li { margin: 4px 0; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 8px 0; padding: 0 !important; }
.facts li { background: var(--chip); border-radius: 999px; padding: 2px 10px; margin: 0 !important; }
.link { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.close { float: right; font: inherit; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">Stacklands</h1>
    <p class="sub" id="generated"></p>
  </div>
  <label class="f" id="langBox" hidden><span id="l-lang">Language</span><select id="lang"></select></label>
</header>
<main>
  <div class="controls" role="search">
    <label class="f wide" for="q"><span id="l-search"></span>
      <input id="q" type="search" autocomplete="off" aria-describedby="hint">
    </label>
    <label class="f" for="cat"><span id="l-cat"></span><select id="cat"></select></label>
    <label class="f" for="type"><span id="l-type"></span><select id="type"></select></label>
    <label class="f" for="upd"><span id="l-upd"></span><select id="upd"></select></label>
    <label class="f" for="ageSel"><span id="l-age"></span><select id="ageSel"></select></label>
    <label class="f" for="obtain"><span id="l-obtain"></span><select id="obtain"></select></label>
    <label class="f" for="sort"><span id="l-sort"></span><select id="sort"></select></label>
    <label class="check" id="foundBox" hidden><input id="onlyFound" type="checkbox" checked> <span id="l-found"></span></label>
    <button class="plain" type="button" id="reset"></button>
  </div>
  <p id="hint"></p>
  <p id="count" role="status" aria-live="polite">…</p>
  <ul class="grid" id="grid"></ul>
</main>
<div id="tip" aria-hidden="true"></div>
<dialog id="detail" aria-labelledby="d-name">
  <div class="dlg" id="d-body"></div>
</dialog>
<script>
// Personal page: the data is written here by the game (F6). Public site: null, data/*.json is loaded instead.
const EMBED = null;
const $ = id => document.getElementById(id);
const fold = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fmt = (s, ...a) => (s || "").replace(/\{(\d)\}/g, (_, i) => a[+i]);
let D, T, byId, producedBy, usedIn, inPacks, droppedBy, ofIdea;

function time(sec) {
  sec = Math.round(sec || 0);
  if (!sec) return "";
  const m = Math.floor(sec / 60), s = sec % 60;
  return m ? (s ? `${m} min ${s} s` : `${m} min`) : `${s} s`;
}
const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
const nameOf = id => byId.has(id) ? byId.get(id).name : id;
const onlyFound = () => D.personal && $("onlyFound").checked;
const recipeKnown = r => !onlyFound() || r.found || r.hidden;
const options = (sel, values, all) => {
  const keep = sel.value;
  sel.innerHTML = "";
  if (all) sel.add(new Option(all, ""));
  values.forEach(v => sel.add(Array.isArray(v) ? new Option(v[1], v[0]) : new Option(v, v)));
  if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
};
const sorted = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b));
function inkFor(hex) {
  if (!hex) return "";
  const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  // Text in palette colours too: Cacao Brown on light cards, Butter Cream on dark ones.
  return (0.299 * r + 0.587 * g + 0.114 * b) > 140 ? "#4B362D" : "#F2E6C9";
}
/**
 * The game gives each kind of card a colour (resources, food, buildings, ideas…). Each of the game's colours is
 * replaced by the closest one of a soft palette, each palette colour used by one game colour only, so
 * kinds of cards stay as distinct as in the game.
 */
const PALETTE = ["#A8C7C5", "#C47F6B", "#A6B89A", "#E2C9A6", "#2F4B63", "#B19AB6", "#D4A037", "#A0907E",
                 "#84B0AE", "#4B362D", "#3C3F44", "#5B2F42", "#6B7A4E", "#F2E6C9", "#E07A5F"];
let paletteMap = new Map();
function lab(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lin = v => { v /= 255; return v > 0.04045 ? Math.pow((v + 0.055) / 1.055, 2.4) : v / 12.92; };
  const r = lin(n >> 16 & 255), g = lin(n >> 8 & 255), b = lin(n & 255);
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const x = f((r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047), y = f(r * 0.2126 + g * 0.7152 + b * 0.0722), z = f((r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}
const dist = (a, b) => { const p = lab(a), q = lab(b); return Math.hypot((p[0] - q[0]) * 0.6, (p[1] - q[1]) * 2.2, (p[2] - q[2]) * 2.2); };
function buildPaletteMap(cards) {
  const counts = new Map();
  cards.forEach(c => { if (c.colors) counts.set(c.colors[0].toUpperCase(), (counts.get(c.colors[0].toUpperCase()) || 0) + 1); });
  paletteMap = new Map();
  const free = [...PALETTE];
  [...counts.keys()].sort((a, b) => counts.get(b) - counts.get(a)).forEach(col => {
    const pool = free.length ? free : PALETTE;
    const best = pool.reduce((m, p) => dist(col, p) < dist(col, m) ? p : m, pool[0]);
    paletteMap.set(col, best);
    const i = free.indexOf(best); if (i >= 0) free.splice(i, 1);
  });
}
const toPalette = hex => paletteMap.get((hex || "").toUpperCase()) || hex;
/** Same hue, stronger colour: the game's pastel palette is hard to tell apart on a page. */
function vivid(hex, sat, light) {
  if (!hex) return hex;
  let n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0, l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h /= 6;
  }
  s = Math.min(1, s * sat); l = Math.max(0, Math.min(1, l + light));
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1/6 ? p + (q - p) * 6 * t : t < 1/2 ? q : t < 2/3 ? p + (q - p) * (2/3 - t) * 6 : p; };
  const hx = v => Math.round(v * 255).toString(16).padStart(2, "0");
  return "#" + hx(f(h + 1/3)) + hx(f(h)) + hx(f(h - 1/3));
}
/** A card drawn like in the game: its colours, name, icon, and a line of numbers. */
function cardFace(c, el) {
  if (c.colors) {
    // Exactly the palette colour, for the card, its border and its name band.
    const bg = toPalette(c.colors[0]), bd = bg;
    el.style.setProperty("--bg", bg);
    el.style.setProperty("--bd", bd);
    el.style.setProperty("--ic", c.colors[2]);
    el.style.setProperty("--tx", inkFor(bg));
    el.style.setProperty("--tx2", inkFor(bd));
  }
  el.innerHTML = `<span class="n"></span><span class="picw"><img class="pic" alt=""><span class="age" aria-hidden="true"></span></span><span class="m"></span>`;
  const ab = el.querySelector(".age"), a = ageOf(c);
  if (c.isPack || !(a < Infinity)) ab.classList.add("none");
  else { ab.textContent = a; ab.title = (T.web_age || "Tech age") + " " + a; }
  el.querySelector(".n").textContent = c.name;
  const pic = el.querySelector(".pic");
  if (c.img) { pic.src = encodeURI(D.imgBase + c.img); pic.onerror = () => pic.classList.add("none"); } else pic.classList.add("none");
  const m = [];
  if (c.isPack) m.push("💰 " + c.pack.cost);
  else if (!c.idea) m.push("💰 " + c.value);
  if (c.food != null) m.push("🍖 " + c.food);
  if (c.hp != null) m.push("❤ " + c.hp, "⚔ " + c.atk);
  el.querySelector(".m").textContent = m.join("  ");
  el.querySelector(".m").setAttribute("aria-hidden", "true");
}
function infoLine(c) {
  if (c.isPack) return [c.cat, `${T.web_pack_ev} ${c.pack.ev}`].join(" · ");
  const parts = [c.cat, c.type, c.upd];
  if (ageOf(c) < Infinity) parts.push(ageLabel(ageOf(c)));
  if (!c.idea) parts.push(T.web_value + " " + c.value);
  if (c.food != null) parts.push(T.web_food + " " + c.food);
  if (c.hp != null) parts.push(`${T.web_health} ${c.hp}, ${T.web_attack} ${c.atk}, ${T.web_defence} ${c.def}`);
  return parts.filter(Boolean).join(" · ");
}

function start(data) {
  D = data; T = data.ui;
  // Packs are shown as cards of the grid too.
  D.packs.forEach(p => D.cards.push({ id: "pack:" + p.id, name: p.name, desc: "", cat: T.web_packs_cat, type: T.web_pack, upd: "",
    value: p.cost, isPack: true, pack: p, img: p.img, found: true, colors: ["#F2E6C9", "#D4A037", "#000000"] }));
  document.documentElement.lang = data.code || "en";
  buildPaletteMap(D.cards);
  byId = new Map(D.cards.map(c => [c.id, c]));
  producedBy = new Map(); usedIn = new Map(); inPacks = new Map(); droppedBy = new Map(); ofIdea = new Map();
  D.recipes.forEach(r => {
    if (r.ideaId) push(ofIdea, r.ideaId, r);
    r.output.forEach(id => push(producedBy, id, r));
    new Set(r.req.flatMap(q => q.ids)).forEach(id => push(usedIn, id, r));
  });
  D.packs.forEach(p => p.cards.forEach(id => push(inPacks, id, p)));
  D.cards.forEach(c => (c.drops || []).forEach(id => push(droppedBy, id, c)));
  computeAges();

  document.title = T.web_title;
  $("title").textContent = T.web_title;
  $("generated").textContent = fmt(D.personal ? T.web_generated : T.web_generated_site, D.generated);
  $("l-lang").textContent = T.web_language;
  $("l-search").textContent = T.web_search;
  $("hint").textContent = T.web_search_hint;
  $("l-cat").textContent = T.web_category;
  $("l-type").textContent = T.web_type;
  $("l-upd").textContent = T.web_content;
  $("l-obtain").textContent = T.web_obtain;
  $("l-age").textContent = T.web_age || "Tech age";
  $("l-sort").textContent = T.web_sort;
  $("l-found").textContent = T.web_only_found;
  $("reset").textContent = T.web_reset;
  $("foundBox").hidden = !D.personal;
  options($("cat"), sorted(D.cards.map(c => c.cat)), T.web_all);
  options($("type"), sorted(D.cards.map(c => c.type)), T.web_all);
  options($("upd"), sorted(D.cards.map(c => c.upd)), T.web_all);
  {
    const keys = [...new Set(D.cards.filter(c => !c.isPack).map(ageKey))].sort((x, y) => (x === "x") - (y === "x") || x - y);
    options($("ageSel"), keys.map(k => [k, k === "x" ? ageLabel(Infinity) : ageLabel(+k)]), T.web_all);
  }
  options($("obtain"), [["recipe", T.web_obtain_recipe], ["pack", T.web_obtain_pack], ["drop", T.web_obtain_drop], ["none", T.web_obtain_none]], T.web_all);
  options($("sort"), [["name", T.web_sort_name], ["value", T.web_sort_value], ["food", T.web_sort_food], ["attack", T.web_sort_attack], ["age", T.web_sort_age || "Tech age"]], null);
  render();
}

// Tech age: how many crafting steps a card is from the basic cards.
// Cards from packs (or that nothing makes) are age 0, a recipe gives 1 + its most advanced ingredient
// (taking the easiest card for each "any of" requirement and the easiest recipe), a drop-only card
// takes the age of what drops it. Ideas take the age of what they make.
let age = new Map();
function computeAges() {
  age = new Map();
  const get = id => age.has(id) ? age.get(id) : Infinity;
  D.cards.forEach(c => {
    if (c.isPack || c.idea) return;
    if ((inPacks.get(c.id) || []).length || (!(producedBy.get(c.id) || []).length && !(droppedBy.get(c.id) || []).length)) age.set(c.id, 0);
  });
  for (let pass = 0, changed = true; changed && pass < 100; pass++) {
    changed = false;
    const lower = (id, v) => { if (v < get(id)) { age.set(id, v); changed = true; } };
    D.recipes.forEach(r => {
      if (!r.output.length) return;
      let v = 0;
      for (const q of r.req) { const m = Math.min(...q.ids.map(get)); if (!(m < Infinity)) { v = Infinity; break; } v = Math.max(v, m); }
      if (v < Infinity) r.output.forEach(id => lower(id, v + 1));
    });
    D.cards.forEach(c => (c.drops || []).forEach(id => { const v = get(c.id); if (v < Infinity) lower(id, v); }));
  }
  D.cards.forEach(c => {
    if (c.isPack) age.set(c.id, 0);
    else if (c.idea) {
      const outs = (ofIdea.get(c.id) || []).flatMap(r => r.output).map(get);
      age.set(c.id, outs.length ? Math.min(...outs) : Infinity);
    }
  });
}
const ageOf = c => age.has(c.id) ? age.get(c.id) : Infinity;
const ageLabel = a => a < Infinity ? fmt(T.web_age_n || "Tech age {0}", a) : (T.web_age_unknown || "Unknown age");
const ageKey = c => { const a = ageOf(c); return a < Infinity ? String(a) : "x"; };

function obtainKind(c) {
  const k = [];
  if ((producedBy.get(c.id) || []).length || (c.idea && (ofIdea.get(c.id) || []).length)) k.push("recipe");
  if ((inPacks.get(c.id) || []).length) k.push("pack");
  if ((droppedBy.get(c.id) || []).length) k.push("drop");
  if (!k.length) k.push("none");
  return k;
}
function recipeText(r) {
  if (!recipeKnown(r)) return T.web_unknown;
  const ing = r.req.map(q => q.label).join(" + ");
  const out = r.output.length ? " → " + r.output.map(nameOf).join(", ") : "";
  const t = time(r.time);
  return `${r.idea ? r.idea + " : " : ""}${ing}${out}${t ? " (" + T.web_time + " " + t + ")" : ""}`;
}
const pct = v => v == null ? "" : (v < 1 ? "<1" : Math.round(v)) + " %";
function packOdds(p, id) {
  let best = null;
  (p.bags || []).forEach(b => b.cards.forEach(x => { if (x.id === id && x.pct != null && (best == null || x.pct > best)) best = x.pct; }));
  return best;
}
function packUnlock(p) {
  if (p.intro || p.quests <= 0) return T.web_pack_unlock_start;
  return fmt(T.web_pack_unlock_quests, p.quests);
}
function howShort(c) {
  if (c.isPack) { const p = c.pack; return [p.cost + (p.currency ? " " + p.currency : ""), p.place, p.quests != null ? T.web_pack_unlock + " : " + packUnlock(p) : ""].filter(Boolean).join(". "); }
  if (c.idea) {
    const ir = ofIdea.get(c.id) || [];
    return ir.length ? ir.slice(0, 2).map(recipeText).join(" ; ") + (ir.length > 2 ? ` (+${ir.length - 2})` : "") : T.web_none;
  }
  const rs = producedBy.get(c.id) || [];
  if (rs.length) return rs.slice(0, 2).map(recipeText).join(" ; ") + (rs.length > 2 ? ` (+${rs.length - 2})` : "");
  const ps = inPacks.get(c.id) || [];
  if (ps.length) return T.web_packs + " : " + ps.map(p => p.name).join(", ");
  const ds = droppedBy.get(c.id) || [];
  if (ds.length) return T.web_from + " : " + ds.slice(0, 4).map(d => d.name).join(", ");
  return T.web_none;
}
function matches(c, q) {
  if (!q) return true;
  const parts = [c.name, c.desc, c.cat, c.type, c.upd];
  (producedBy.get(c.id) || []).concat(ofIdea.get(c.id) || []).forEach(r => { parts.push(r.idea); r.req.forEach(x => parts.push(x.label)); });
  return fold(parts.join(" ")).includes(q);
}
const sorters = {
  name: (a, b) => a.name.localeCompare(b.name),
  value: (a, b) => b.value - a.value || a.name.localeCompare(b.name),
  food: (a, b) => (b.food ?? -1) - (a.food ?? -1) || a.name.localeCompare(b.name),
  attack: (a, b) => (b.atk ?? -1) - (a.atk ?? -1) || a.name.localeCompare(b.name),
  age: (a, b) => (ageOf(a) - ageOf(b) || 0) || (!!a.idea - !!b.idea) || a.name.localeCompare(b.name),
};

function render() {
  const q = fold($("q").value.trim()), cat = $("cat").value, type = $("type").value, upd = $("upd").value, ob = $("obtain").value, ag = $("ageSel").value;
  const shown = D.cards
    .filter(c => (!onlyFound() || c.found) && (!cat || c.cat === cat) && (!type || c.type === type) && (!upd || c.upd === upd)
              && (!ob || obtainKind(c).includes(ob)) && (!ag || (!c.isPack && ageKey(c) === ag)) && matches(c, q))
    .sort(sorters[$("sort").value] || sorters.name);
  const grid = $("grid");
  grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  shown.forEach((c, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "card" + (D.personal && !c.found ? " unknown" : "");
    b.type = "button";
    const how = infoLine(c) + ". " + howShort(c);
    cardFace(c, b);
    const sr = document.createElement("span");
    sr.className = "sr"; sr.id = "h" + i; sr.textContent = how;
    b.appendChild(sr);
    b.setAttribute("aria-describedby", "h" + i);
    b.addEventListener("click", () => openCard(c.id, b));
    b.addEventListener("mouseenter", () => showTip(how, b));
    b.addEventListener("focus", () => showTip(how, b));
    b.addEventListener("mouseleave", hideTip);
    b.addEventListener("blur", hideTip);
    li.appendChild(b);
    frag.appendChild(li);
  });
  grid.appendChild(frag);
  $("count").textContent = fmt(shown.length === 1 ? T.web_count_one : T.web_count, shown.length);
}
function showTip(text, el) {
  const tip = $("tip"), r = el.getBoundingClientRect();
  tip.textContent = text;
  tip.style.display = "block";
  const x = Math.min(r.left, window.innerWidth - tip.offsetWidth - 8);
  const y = r.bottom + 6 + tip.offsetHeight > window.innerHeight ? r.top - tip.offsetHeight - 6 : r.bottom + 6;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = y + "px";
}
function hideTip() { $("tip").style.display = "none"; }

let returnFocus = null;
function cardLink(id) {
  const b = document.createElement("button");
  b.className = "link"; b.type = "button";
  b.textContent = nameOf(id);
  if (byId.has(id)) b.addEventListener("click", () => openCard(id)); else b.disabled = true;
  return b;
}
function section(body, title, items, build) {
  const h = document.createElement("h3"); h.textContent = title; body.appendChild(h);
  if (!items.length) { const p = document.createElement("p"); p.className = "muted"; p.textContent = T.web_none; body.appendChild(p); return; }
  const ul = document.createElement("ul");
  items.forEach(it => { const li = document.createElement("li"); build(li, it); ul.appendChild(li); });
  body.appendChild(ul);
}
function recipeItem(li, r) {
  if (!recipeKnown(r)) { li.textContent = T.web_unknown; return; }
  if (r.idea) li.append(r.idea + " : ");
  r.req.forEach((q, i) => {
    if (i) li.append(" + ");
    if (q.ids.length === 1) li.append(cardLink(q.ids[0])); else li.append(q.label);
  });
  if (r.output.length) { li.append(" → "); r.output.forEach((id, i) => { if (i) li.append(", "); li.append(cardLink(id)); }); }
  const t = time(r.time);
  if (t) li.append(` (${T.web_time} ${t})`);
  if (r.group) li.append(` — ${T.web_group} : ${r.group}`);
}
function openCard(id, from) {
  const c = byId.get(id); if (!c) return;
  if (from) returnFocus = from;
  const body = $("d-body"); body.innerHTML = "";
  const close = document.createElement("button");
  close.className = "close"; close.type = "button"; close.textContent = T.web_close;
  close.addEventListener("click", () => $("detail").close());
  body.appendChild(close);
  const hero = document.createElement("div"); hero.className = "hero";
  const face = document.createElement("div"); face.className = "card"; face.setAttribute("aria-hidden", "true");
  cardFace(c, face);
  const right = document.createElement("div");
  const h = document.createElement("h2"); h.id = "d-name"; h.tabIndex = -1;
  h.textContent = c.name + (c.rumor ? " (" + T.web_rumor + ")" : "");
  right.appendChild(h);
  hero.append(face, right);
  body.appendChild(hero);
  const facts = document.createElement("ul"); facts.className = "facts";
  const fact = t => { const li = document.createElement("li"); li.textContent = t; facts.appendChild(li); };
  fact(T.web_category_label + " : " + c.cat);
  fact(T.web_type + " : " + c.type);
  fact(T.web_content + " : " + c.upd);
  fact(T.web_value + " : " + c.value);
  if (c.food != null) fact(T.web_food + " : " + c.food);
  if (!c.isPack && ageOf(c) < Infinity) fact((T.web_age || "Tech age") + " : " + ageOf(c));
  if (c.hp != null) { fact(T.web_health + " : " + c.hp); fact(T.web_attack + " : " + c.atk); fact(T.web_defence + " : " + c.def); }
  right.appendChild(facts);
  if (c.group) fact(T.web_group + " : " + c.group);
  if (c.desc) { const p = document.createElement("p"); p.textContent = c.desc; right.appendChild(p); }
  if (c.isPack) { packDetails(c.pack, body, facts, fact); finishDialog(h); return; }
  if (c.idea) section(body, T.web_idea_recipes, ofIdea.get(id) || [], recipeItem);
  section(body, T.web_how, producedBy.get(id) || [], recipeItem);
  section(body, T.web_packs, inPacks.get(id) || [], (li, p) => {
    li.append(cardLink("pack:" + p.id));
    const o = packOdds(p, id);
    li.append(` — ${p.cost} ${p.currency}${o != null ? ", " + pct(o) + " " + T.web_pack_per_draw : ""}`);
  });
  section(body, T.web_from, droppedBy.get(id) || [], (li, d) => li.append(cardLink(d.id)));
  section(body, T.web_used, usedIn.get(id) || [], recipeItem);
  if (c.drops) section(body, T.web_drops, c.drops, (li, d) => li.append(cardLink(d)));
  finishDialog(h);
}
function finishDialog(h) {
  const dlg = $("detail");
  if (!dlg.open) dlg.showModal();
  h.focus();
}
/** Pack details: price, where it is sold, how to unlock it, and every card it can give with its odds. */
function packDetails(p, body, facts, fact) {
  facts.innerHTML = "";
  fact(`${T.web_pack_cost} : ${p.cost} ${p.currency}`);
  fact(`${T.web_pack_place} : ${p.place}`);
  fact(`${T.web_pack_unlock} : ${packUnlock(p)}`);
  fact(`${T.web_pack_ev} : ${p.ev}`);
  const h = document.createElement("h3"); h.textContent = T.web_pack_bags; body.appendChild(h);
  (p.bags || []).forEach(b => {
    const intro = document.createElement("p");
    intro.textContent = fmt(T.web_pack_bag, b.count) + (b.cond ? " (" + b.cond + ")" : "")
      + (b.kind === "SetPack" ? " — " + T.web_pack_fixed : b.kind === "Enemies" ? " — " + T.web_pack_strength : "");
    body.appendChild(intro);
    const ul = document.createElement("ul");
    [...b.cards].sort((x, y) => (y.pct ?? -1) - (x.pct ?? -1)).forEach(x => {
      const li = document.createElement("li");
      if (x.enemy || !x.id) li.append(T.web_pack_enemy); else li.append(cardLink(x.id));
      const notes = [];
      if (x.pct != null) notes.push(pct(x.pct));
      if (x.max != null) notes.push(fmt(T.web_pack_max, x.max));
      if (x.needs) notes.push(fmt(T.web_pack_needs, nameOf(x.needs)));
      if (notes.length) li.append(" — " + notes.join(", "));
      ul.appendChild(li);
    });
    body.appendChild(ul);
  });
}
$("detail").addEventListener("close", () => { if (returnFocus) returnFocus.focus(); });

let timer = null;
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 150); });
["cat", "type", "upd", "obtain", "ageSel", "sort", "onlyFound"].forEach(id => $(id).addEventListener("change", render));
$("reset").addEventListener("click", () => {
  $("q").value = ""; ["cat", "type", "upd", "obtain", "ageSel"].forEach(id => $(id).value = ""); $("sort").value = "name";
  render(); $("q").focus();
});

async function loadSite() {
  const langs = await (await fetch("data/languages.json")).json();
  const sel = $("lang");
  langs.forEach(l => sel.add(new Option(l.name, l.file)));
  $("langBox").hidden = false;
  const want = new URLSearchParams(location.search).get("lang") || navigator.language || "en";
  const pick = langs.find(l => l.code === want) || langs.find(l => want.toLowerCase().startsWith(l.code.toLowerCase().split("-")[0])) || langs.find(l => l.code === "en") || langs[0];
  sel.value = pick.file;
  const load = async file => { $("count").textContent = "…"; start(await (await fetch(file)).json()); };
  sel.addEventListener("change", () => load(sel.value));
  await load(pick.file);
}
if (EMBED) start(EMBED); else loadSite();
$("q").focus();
</script>
</body>
